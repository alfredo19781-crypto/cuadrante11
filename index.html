    // Función matemática para calcular diferencia horaria considerando el salto de medianoche
    function calcularDiferenciaHoras(inicio, fin) {
      if (!inicio || !fin) return 0;
      const [hIni, mIni] = inicio.split(':').map(Number);
      const [hFin, mFin] = fin.split(':').map(Number);
      
      let difMinutos = (hFin * 60 + mFin) - (hIni * 60 + mIni);
      if (difMinutos <= 0) {
        difMinutos += 24 * 60; // Suma un día entero si termina al día siguiente
      }
      return parseFloat((difMinutos / 60).toFixed(2));
    }
    // ... (código existente de calcularDiferenciaHoras)

  function calcularJornadasReales(ingreso) {
    const anioActual = new Date().getFullYear();
    const annosServicio = anioActual - parseInt(ingreso);
    
    
    let baseJornadas = 193;
    let adicionales = 0;
    
    if (annosServicio >= 30) adicionales = 4;
    else if (annosServicio >= 25) adicionales = 3;
    else if (annosServicio >= 20) adicionales = 2;
    else if (annosServicio >= 15) adicionales = 1;
    
    return baseJornadas - adicionales;
}

function calcularAsuntosPropios(trienios) {
    let adicionales = 0;
    
    if (trienios < 6) adicionales = 0;
    else if (trienios === 6 || trienios === 7) adicionales = 2;
    else if (trienios === 8) adicionales = 3;
    else if (trienios === 9) adicionales = 4;
    else if (trienios === 10) adicionales = 5;
    else if (trienios === 11) adicionales = 6;
    else if (trienios === 12) adicionales = 7;
    else if (trienios === 13) adicionales = 8;
    else if (trienios === 14) adicionales = 9;
    else if (trienios === 15) adicionales = 10;
    else if (trienios >= 16) adicionales = 11;
    
    return 6 + adicionales; // Sumamos la base de 6
}

  function calcularTotales(user, year) {
    const datosCuadrante = user.cuadrante || {};
    const periodosVacaciones = (user.periodos || []).filter(p => p && p.y === year && !p.esProrroga);
    
    let totalJornadas = 0;

    Object.keys(datosCuadrante).forEach(fechaKey => {
        const turno = datosCuadrante[fechaKey];
        
        // Vamos a ser más flexibles: si el año existe, lo comprobamos
        // Si turno.y no existe, intentamos extraerlo de la fechaKey
        const anioTurno = turno.y ? parseInt(turno.y) : parseInt(fechaKey.split('-')[0]);

        if (anioTurno === year) {
            // Comprobamos vacaciones
            const [y, m, d] = fechaKey.split('-').map(Number);
            const fechaActual = new Date(y, m - 1, d);
            
            const esVacacion = periodosVacaciones.some(p => {
                const start = new Date(p.y, p.mIni - 1, p.dIni);
                const end = new Date(p.y, p.mFin - 1, p.dFin);
                return fechaActual >= start && fechaActual <= end;
            });

            if (!esVacacion) {
                if (turno.tipo === '24h' || turno.tipo === 'G-24h') {
                    totalJornadas += 3;
                } else if (turno.tipo === '12h-D' || turno.tipo === '12h-N' || turno.tipo === 'G-12h') {
                    totalJornadas += 1.5;
                }
            }
        }
    });

    return totalJornadas;

        </div>
      );
    })}
    <button className="btn-primary" onClick={() => setUser({...user, ap: [...(user.ap || []), {id:Date.now(), y:year, dia:null, mes:null, turno:""}]})}>+ Añadir AP</button>
  </div>
)}

              {/* --- SECCIÓN GUARDIAS --- */}
{tabActiva === 'Guardias' && (
  <div className="card" style={{borderTop:'3px solid #F59E0B'}}>
    <label>🛡️ REGISTRO DE GUARDIAS</label>
    {(user.guardias || []).filter(g => g && g.y === year).map(g => {
      // Calculamos días según el mes seleccionado para esta guardia
      const diasDelMes = g.mes ? getDiasEnMes(g.mes, year) : 31;

      return (
        <div key={g.id} className="row-config">
          <div className="inputs-group">
            {/* Selector de día dinámico */}
            <select value={g.dia || ""} onChange={e => setUser({...user, guardias: user.guardias.map(x=>x.id===g.id?{...x, dia:parseInt(e.target.value)}:x)})}>
               <option value="" disabled>Día</option>
               {Array.from({length: diasDelMes}, (_, i) => i + 1).map(d => <option key={d} value={d}>{d}</option>)}
            </select>
            
            {/* Selector de mes */}
            <select value={g.mes || ""} onChange={e => setUser({...user, guardias: user.guardias.map(x=>x.id===g.id?{...x, mes:parseInt(e.target.value)}:x)})}>
              <option value="" disabled>Mes</option>{MESES_NOM.map((m,i)=><option key={i} value={i+1}>{m}</option>)}
            </select>

            {/* Resto de campos (tipo y horas) */}
            <select value={g.tipo || "Localizada"} onChange={e => setUser({...user, guardias: user.guardias.map(x=>x.id===g.id?{...x, tipo:e.target.value}:x)})}>
              <option value="Localizada">Localizada</option>
              <option value="Presencial">Presencial</option>
            </select>
            <input type="number" placeholder="Horas" value={g.horas || ""} onChange={e => setUser({...user, guardias: user.guardias.map(x=>x.id===g.id?{...x, horas:parseInt(e.target.value)||0}:x)})} style={{width:'60px'}} />
          </div>
          <button className="btn-del" onClick={() => setUser({...user, guardias: user.guardias.filter(x => x.id !== g.id)})}>🗑️ Borrar</button>
        </div>
      );
    })}
    <button className="btn-primary" style={{background:'#F59E0B'}} onClick={() => setUser({...user, guardias: [...(user.guardias || []), {id:Date.now(), y:year, dia:null, mes:null, tipo:"Localizada", horas:24}]})}>+ Añadir Guardia</button>
  </div>
)}

               {/* --- SECCIÓN MOVILIZACIONES RANGOS HORARIOS --- */}
{tabActiva === 'Movilizaciones' && (
  <div className="card" style={{borderTop:'3px solid #8B5CF6'}}>
    <label><i className="fa-solid fa-user-clock"></i> GESTIÓN DE MOVILIZACIONES (HORAS EXTRAS)</label>
    
    <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', background:'#EEF2F6', padding:'8px', borderRadius:'8px', marginBottom:'10px'}}>
      <span style={{fontSize:'12px', fontWeight:'600', color:'#475569'}}>Horas acumuladas año anterior (Máx 8h):</span>
      <input 
        type="number" 
        min="0" 
        max="8" 
        value={(user.mov_arrastradas && user.mov_arrastradas[year]) || 0} 
        onChange={e => {
          const hVal = Math.min(8, Math.max(0, parseInt(e.target.value) || 0));
          setUser({
            ...user,
            mov_arrastradas: { ...(user.mov_arrastradas || {}), [year]: hVal }
          });
        }} 
        style={{width:'65px', padding:'4px', textAlign:'center', fontWeight:'bold'}} 
      />
    </div>

    {(user.movilizaciones || []).filter(m => m && m.y === year).map(m => {
      // Cálculo de días según mes
      const diasDelMes = m.mes ? getDiasEnMes(m.mes, year) : 31;
      
      return (
        <div key={m.id} className="row-config">
          <div className="inputs-group" style={{flexWrap: 'wrap', gap: '4px'}}>
            {/* SELECT DÍA DINÁMICO */}
            <select value={m.dia || ""} onChange={e => setUser({...user, movilizaciones: user.movilizaciones.map(x=>x.id===m.id?{...x, dia:parseInt(e.target.value)}:x)})} style={{width:'55px'}}>
               <option value="" disabled>Día</option>
               {Array.from({length: diasDelMes}, (_, i) => i + 1).map(d => <option key={d} value={d}>{d}</option>)}
            </select>
            
            <select value={m.mes || ""} onChange={e => setUser({...user, movilizaciones: user.movilizaciones.map(x=>x.id===m.id?{...x, mes:parseInt(e.target.value)}:x)})} style={{flex:'1', minWidth: '70px'}}>
              <option value="" disabled>Mes</option>{MESES_NOM.map((mName,i)=><option key={i} value={i+1}>{mName.slice(0,3)}</option>)}
            </select>
            
            <div style={{display:'flex', alignItems:'center', gap:'2px', background:'#F1F5F9', padding:'2px 4px', borderRadius:'6px'}}>
              <input type="time" value={m.horaInicio || "00:00"} onChange={e => setUser({...user, movilizaciones: user.movilizaciones.map(x=>x.id===m.id?{...x, horaInicio:e.target.value}:x)})} style={{padding:'2px', fontSize:'11px', border:'1px solid #CBD5E1', borderRadius:'4px'}} />
              <span style={{fontSize:'10px', color:'#64748B'}}>a</span>
              <input type="time" value={m.horaFin || "00:00"} onChange={e => setUser({...user, movilizaciones: user.movilizaciones.map(x=>x.id===m.id?{...x, horaFin:e.target.value}:x)})} style={{padding:'2px', fontSize:'11px', border:'1px solid #CBD5E1', borderRadius:'4px'}} />
            </div>
            
            <div style={{fontSize:'11px', fontWeight:'bold', color:'#4F46E5', minWidth:'40px', textAlign:'center'}}>
              {calcularDiferenciaHoras(m.horaInicio, m.horaFin)}h
            </div>
          </div>
          <button className="btn-del" onClick={() => setUser({...user, movilizaciones: user.movilizaciones.filter(x => x.id !== m.id)})}>🗑️ Borrar</button>
        </div>
      );
    })}
    <button className="btn-primary" style={{background:'#8B5CF6'}} onClick={() => setUser({...user, movilizaciones: [...(user.movilizaciones || []), {id:Date.now(), y:year, dia:null, mes:null, horaInicio:"00:00", horaFin:"08:00"}]})}>+ Añadir por Rango Horario</button>
  </div>
)}

                {/* --- SECCIÓN PERMISOS --- */}
{tabActiva === 'Permisos' && (
  <div className="card" style={{borderTop:'3px solid #64748B'}}>
    <label>📝 GESTIÓN DE PERMISOS</label>
    {(user.permisos || []).filter(p => p && p.y === year).map(p => {
      // Calculamos días disponibles para este permiso según su mes
      const diasDelMes = p.mes ? getDiasEnMes(p.mes, year) : 31;
      
      return (
        <div key={p.id} className="row-config">
          <div className="inputs-group">
            {/* Selector de día dinámico */}
            <select value={p.dia || ""} onChange={e => setUser({...user, permisos: user.permisos.map(x=>x.id===p.id?{...x, dia:parseInt(e.target.value)}:x)})} style={{width:'55px'}}>
              <option value="" disabled>Día</option>
              {Array.from({length: diasDelMes}, (_, i) => i + 1).map(d => <option key={d} value={d}>{d}</option>)}
            </select>
            
            {/* Selector de mes */}
            <select value={p.mes || ""} onChange={e => setUser({...user, permisos: user.permisos.map(x=>x.id===p.id?{...x, mes:parseInt(e.target.value)}:x)})} style={{flex:'1'}}>
              <option value="" disabled>Mes</option>{MESES_NOM.map((m,i)=><option key={i} value={i+1}>{m}</option>)}
            </select>
            
            <input type="text" placeholder="Concepto" value={p.concepto || ""} onChange={e => setUser({...user, permisos: user.permisos.map(x=>x.id===p.id?{...x, concepto:e.target.value}:x)})} style={{flex:'2'}} />
          </div>
          <button className="btn-del" onClick={() => setUser({...user, permisos: user.permisos.filter(x => x.id !== p.id)})}>🗑️ Borrar</button>
        </div>
      );
    })}
    <button className="btn-primary" style={{background:'#64748B'}} onClick={() => setUser({...user, permisos: [...(user.permisos || []), {id:Date.now(), y:year, dia:null, mes:null, concepto:""}]})}>+ Añadir Permiso</button>
  </div>
)}

                {/* --- SECCIÓN OTROS --- */}
{tabActiva === 'Otros' && (
  <div className="card" style={{borderTop:'3px solid #06B6D4'}}>
    <label>💼 RECONOCIMIENTOS / CURSOS / COMISIONES</label>
    
    {(user.otros || []).filter(o => o && o.y === year).map(o => {
      // 1. Definimos la constante de días ANTES del return
      const diasDelMes = o.mes ? getDiasEnMes(o.mes, year) : 31;
      
      // 2. Usamos el return explícito
      return (
        <div key={o.id} className="row-config">
          <div className="inputs-group">
            {/* SELECTOR DÍA DINÁMICO */}
            <select value={o.dia || ""} onChange={e => setUser({...user, otros: user.otros.map(x=>x.id===o.id?{...x, dia:parseInt(e.target.value)}:x)})} style={{width:'55px'}}>
              <option value="" disabled>Día</option>
              {Array.from({length: diasDelMes}, (_, i) => i + 1).map(d => <option key={d} value={d}>{d}</option>)}
            </select>
            
            <select value={o.mes || ""} onChange={e => setUser({...user, otros: user.otros.map(x=>x.id===o.id?{...x, mes:parseInt(e.target.value)}:x)})} style={{flex:'1'}}>
              <option value="" disabled>Mes</option>{MESES_NOM.map((m,i)=><option key={i} value={i+1}>{m}</option>)}
            </select>
            
            <input type="text" placeholder="Concepto" value={o.concepto || ""} onChange={e => setUser({...user, otros: user.otros.map(x=>x.id===o.id?{...x, concepto:e.target.value}:x)})} style={{flex:'2'}} />
            <input type="number" placeholder="Horas" value={o.horas || ""} onChange={e => setUser({...user, otros: user.otros.map(x=>x.id===o.id?{...x, horas:parseInt(e.target.value)||0}:x)})} style={{width:'60px'}} />
          </div>
          <button className="btn-del" onClick={() => setUser({...user, otros: user.otros.filter(x => x.id !== o.id)})}>🗑️ Borrar</button>
        </div>
      );
    })}
    
    <button className="btn-primary" style={{background:'#06B6D4'}} onClick={() => setUser({...user, otros: [...(user.otros || []), {id:Date.now(), y:year, dia:null, mes:null, concepto:"", horas:0}]})}>+ Añadir Registro</button>
  </div>
)} 

{/* --- BOTÓN CERRAR Y MODALES SIGUIENTES --- */}
<button className="btn-danger" onClick={() => setShowGear(false)} style={{marginTop:'10px'}}>CERRAR PANEL</button>
</div>
</div>
)}

{detallesBolsa && (
  <div className="modal" onClick={() => setDetallesBolsa(null)}>
    <div className="modal-content" onClick={e => e.stopPropagation()}>
      <h3>Historial: {detallesBolsa.tipo}</h3>
      <div style={{maxHeight:'300px', overflowY:'auto'}}>
        {detallesBolsa.data?.filter(i => i.y === year).map((item, idx) => (
          <div key={idx} style={{padding:'8px', borderBottom:'1px solid #E2E8F0', fontSize:'13px'}}>
            {item.dia}/{item.mes} - {item.concepto || item.turno || item.tipo}
          </div>
        ))}
      </div>
      <button className="btn-primary" onClick={() => setDetallesBolsa(null)}>Cerrar</button>
    </div>
  </div>
)}
       {/* --- MODAL RESTAURAR BACKUP --- */}
{mostrarModalImportar && (
  <div className="modal" onClick={() => setMostrarModalImportar(false)}>
    <div className="modal-content" onClick={e => e.stopPropagation()}>
      <h3>Restaurar Copia de Seguridad</h3>
      <textarea 
        rows="6" 
        placeholder="Pega aquí el código cifrado..." 
        value={textoAImportar} 
        onChange={e => setTextoAImportar(e.target.value)} 
        style={{marginTop:'10px', fontFamily:'monospace', fontSize:'11px', width:'100%'}}
      />
      <button 
        className="btn-primary" 
        onClick={() => {
          if (typeof manejarImportar === 'function') {
            manejarImportar();
          } else {
            console.error("Función manejarImportar no encontrada");
            alert("Error: La función 'manejarImportar' no está definida en este componente.");
          }
        }}
      >
        RESTAURAR AHORA
      </button>
      <button className="btn-danger" style={{background:'#64748B'}} onClick={() => setMostrarModalImportar(false)}>CANCELAR</button>
    </div>
  </div>
)}

{/* --- SUBMODAL EXPORTAR BACKUP --- */}
{textoExportado && (
  <div className="modal" onClick={() => setTextoExportado("")}>
    <div className="modal-content" onClick={e => e.stopPropagation()}>
      <h3>Tu Código de Seguridad</h3>
      <p style={{fontSize:'12px', color:'#64748B', margin:'5px 0'}}>Guarda este bloque de texto en tus notas:</p>
      <textarea 
        readOnly 
        rows="6" 
        value={textoExportado} 
        onClick={e => e.target.select()} 
        style={{background:'#F1F5F9', fontFamily:'monospace', fontSize:'11px', width:'100%'}}
      />
      <button className="btn-primary" onClick={() => { navigator.clipboard.writeText(textoExportado); alert("¡Copiado!"); }}>COPIAR TEXTO</button>
      <button className="btn-danger" onClick={() => setTextoExportado("")}>CERRAR</button>
    </div>
  </div>
)}

</div>
);
}

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);

    // Petición automática de pantalla completa al tocar la app
    window.addEventListener("click", function() {
      const doc = window.document;
      const docEl = doc.documentElement;
      const requestFullscreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
      
      if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        requestFullscreen.call(docEl).catch(err => {
          console.log("Modo pantalla completa bloqueado por el navegador.");
        });
      }
    });
  </script>
</body>
</html>
